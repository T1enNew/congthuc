# CI/CD cho Sổ tay pha chế
# - Mỗi lần push / mở Pull Request: kiểm tra code + dữ liệu công thức + ảnh (npm test) và build thử.
# - Push lên nhánh main: tự đưa web lên GitHub Pages.
# - Nếu repo có secret CLOUDFLARE_API_TOKEN: tự cập nhật AI Worker (ai-proxy/) lên Cloudflare.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Kiểm tra & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Kiểm tra code, dữ liệu công thức, ảnh
        run: npm test

      - name: Build bản web (dist/)
        run: npm run build

      - name: Đóng gói cho GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    name: Đưa web lên GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    name: Cập nhật AI Worker (Cloudflare)
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Chưa cấu hình Cloudflare thì bỏ qua
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Chưa có secret CLOUDFLARE_API_TOKEN — bỏ qua deploy Worker (xem ai-proxy/README.md)."

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-proxy
